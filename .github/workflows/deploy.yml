name: Deploy to VPS

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            cd serviceflow-web/
            git fetch origin dev
            git checkout .
            git reset --hard origin/dev
            git clean -fd
            corepack enable
            corepack prepare pnpm@latest --activate
            pnpm install
            cd apps/api
            pnpm build
            pm2 restart serviceflow-api || pm2 start ../../ecosystem.config.js --only serviceflow-api
            cd ../web
            pnpm build
            pm2 restart serviceflow-web || pm2 start ../../ecosystem.config.js --only serviceflow-web
            cd ../landing
            pnpm build
            pm2 restart serviceflow-landing || pm2 start ../../ecosystem.config.js --only serviceflow-landing
